name: Build VivaroAssistant

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Find latest VivaroAssistant ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name 'VivaroAssistant_Clean_v*.zip' | sort -V | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No VivaroAssistant_Clean_v*.zip found."
            exit 1
          fi

          echo "======================================"
          echo "Using project:"
          echo "$ZIP"
          echo "======================================"

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "Project unpacked successfully."

      - name: Verify Android project
        run: |
          set -e

          echo "Checking project structure..."

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml

          echo "Android project structure: OK"

      - name: Verify VivaroAssistant applicationId
        run: |
          set -e

          grep -q 'applicationId = "com.vivaroassistant.app"' project/app/build.gradle.kts

          echo "applicationId: com.vivaroassistant.app"
          echo "Application ID verification: OK"

      - name: Verify no old CarAssistant package
        run: |
          set -e

          if grep -R -n 'com.carassistant.app' project/app/src/main 2>/dev/null; then
            echo "ERROR: Old CarAssistant package detected!"
            exit 1
          fi

          echo "Old CarAssistant package: NOT FOUND"

      - name: Build Debug APK
        run: |
          set -e

          echo "Starting Android build..."

          gradle --no-daemon -p project clean assembleDebug

          echo "Android build completed successfully."

      - name: Verify APK
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VivaroAssistant-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
