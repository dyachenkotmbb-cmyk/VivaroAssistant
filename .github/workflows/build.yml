name: Build VivaroAssistant

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Find latest VivaroAssistant ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f \
            -name 'VivaroAssistant_Clean_v*.zip' \
            | sort -V \
            | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No VivaroAssistant_Clean_v*.zip found."
            exit 1
          fi

          echo "======================================"
          echo "Using project:"
          echo "$ZIP"
          echo "======================================"

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "ZIP unpacked successfully."

      - name: Locate Android project
        run: |
          set -e

          SETTINGS_FILE=$(find project -type f \
            -name 'settings.gradle.kts' \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find project -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "======================================"
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Verify Android project
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "Checking project structure..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project structure: OK"

      - name: Verify VivaroAssistant applicationId
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          grep -q 'applicationId = "com.vivaroassistant.app"' \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo "applicationId: com.vivaroassistant.app"
          echo "Application ID verification: OK"

      - name: Verify no old CarAssistant package
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          if grep -R -n 'com.carassistant.app' \
            "$PROJECT_DIR/app/src/main" 2>/dev/null; then

            echo "ERROR: Old CarAssistant package detected!"
            exit 1
          fi

          echo "Old CarAssistant package: NOT FOUND"

      - name: Build Debug APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "Starting Android build..."
          echo "Project: $PROJECT_DIR"
          echo "======================================"

          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean \
            assembleDebug

          echo "Android build completed successfully."

      - name: Verify APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "APK successfully created:"
          ls -lh "$APK"
          echo "======================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VivaroAssistant-debug
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
