name: Build VivaroAssistant

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Unpack clean project
        run: |
          rm -rf project
          mkdir project
          unzip -q VivaroAssistant_Clean_v1.zip -d project

      - name: Build APK
        run: |
          gradle --no-daemon -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VivaroAssistant-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
